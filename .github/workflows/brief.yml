name: argus-health

on:
  schedule:
    # 11:30 UTC = 07:30 America/Detroit (EDT). GitHub cron is UTC-only and has
    # no DST awareness -- this drifts an hour in winter. Adjust or accept it.
    - cron: "30 11 * * 1-5"
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The spine's tests are stdlib-only and run in under a second, so they gate
  # every push rather than only the scheduled run. A store whose validator has
  # regressed is worse than no store: it accepts what it should reject, and the
  # damage is silent until a post-mortem months later (see ADR 0002).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite (no dependencies needed)
        run: python3 -m unittest discover -s tests -v

      - name: Audit every store
        run: python3 -m argus doctor

      - name: Graph integrity
        run: python3 -m argus.graph stats

  health:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check source health
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          RWA_XYZ_API_KEY: ${{ secrets.RWA_XYZ_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ARGUS_USER_AGENT: ${{ secrets.ARGUS_USER_AGENT }}
        run: python3 scripts/check_sources.py

      # `argus status` exits non-zero when predictions are overdue. That is the
      # point: an overdue call is memory-holing on a delay, and the annotation
      # is how it stops being easy to ignore.
      - name: Book status
        run: |
          python3 -m argus status \
            || echo '::warning::overdue predictions need resolving -- run: python3 -m argus status'

      - name: Unanchored resolve-by dates (EP-000b)
        run: |
          python3 -m argus.catalysts orphans \
            | grep -q "EP-000b clear" \
            || echo "::warning::open predictions are anchored to no catalyst"

      - name: Score the ledger, including the market head-to-head
        run: python3 -m argus.ledger score

      - name: Calibration report
        run: python3 scripts/calibration.py

      - name: Commit any store updates
        run: |
          git config user.name  "argus-bot"
          git config user.email "argus-bot@users.noreply.github.com"
          git add -A data/ docs/
          git diff --staged --quiet || git commit -m "chore: automated health run $(date -u +%F)"
          git push
